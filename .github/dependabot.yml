version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns:
          - illuminate/*
          - orchestra/testbench
      testing:
        patterns:
          - pestphp/*
          - laravel/pint

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
